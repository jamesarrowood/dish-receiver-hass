# Universal Remote Card (Nerwyn/universal-remote-card, a separate HACS frontend
# card — not the dish-remote-card bundled with this integration) configured for
# every key confirmed working over IP on a Wally.
# See tools/protocol-findings/WALLY_KEYS.md for the source of truth.
#
# Every button calls remote.send_command explicitly (action: perform-action)
# rather than relying on the card's built-in "Generic Remote" name-guessing,
# so it's guaranteed to send exactly the command this integration expects.
#
# Deliberately omitted: Power, Volume +/-, Channel +/-, Page +/-, Fast-Forward,
# Dash — none are exposed over IP on a Wally (see WALLY_KEYS.md). Including
# them would just add dead buttons.
#
# Replace remote.dish_receiver_remote below with your actual entity id if it
# differs (Settings -> Devices & Services -> your receiver -> Entities).

type: custom:universal-remote-card
remote_id: remote.dish_receiver_remote
platform: Generic Remote
title: DISH Receiver
rows:
- - dvr
  - home
  - guide
- - options
  - search
  - input
- - null
  - up
  - null
- - left
  - select
  - right
- - null
  - down
  - null
- - back
  - cancel
  - info
- - live_tv
  - menu
  - format
- - rewind
  - play
  - pause
  - stop
  - jump
- - record
  - recall
  - mute
